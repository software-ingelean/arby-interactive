[project]
name = "triki"
version = "0.1.0"
description = "Bot interactivo con Trill Craft y voz neuronal para Raspberry Pi"
readme = "LEEME.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "edge-tts>=7.2,<8",
    "faiss-cpu>=1.15.1",
    "google-genai>=2.34.0",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pygame>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "sentence-transformers>=6.2.0",
    "smbus2>=0.5,<1",
    "torch>=2.15.0",
]

[project.optional-dependencies]
led = [
    "adafruit-blinka",
    "adafruit-circuitpython-neopixel",
    "rpi-ws281x",
    "gpiod>=2.2.2,<3",
    "Adafruit-Blinka-Raspberry-Pi-PWM>=1.0.2",
]
voice = [
    "scipy>=1.17.1",
    "silero-onnx",
    "sounddevice>=0.5.6",
    "soxr>=1.1.0",
    "speechrecognition>=3.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
silero-onnx = { git = "https://github.com/knowl-doc/silero-onnx.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
